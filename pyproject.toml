[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d0fus"
version = "3.1.0"
description = "Design 0-dimensional for Fusion Systems - Tokamak power plant design and optimization tool"
readme = "README.md"
license = {text = "CeCILL-C"}
authors = [
    {name = "Timothé Auclair", email = "timothe.auclair@gmail.com"}
]
maintainers = [
    {name = "Timothé Auclair", email = "timothe.auclair@gmail.com"}
]
keywords = [
    "fusion",
    "tokamak",
    "plasma",
    "power-plant",
    "design",
    "nuclear",
    "superconductor",
    "magnetic-confinement",
    "ITER",
    "DEMO"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
# Lower bounds: np.trapezoid needs NumPy 2.0. Matplotlib and SciPy
# releases older than the bounds below are built for NumPy 1.x. Parallel
# with return_as needs joblib 1.3. Smallest set tested: Python 3.10 with
# exactly these versions.
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8.4",
    "scipy>=1.13",
    "tqdm>=4.60.0",
    "deap>=1.3.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
viz3d = ["pyvista>=0.40"]

[project.urls]
Homepage = "https://github.com/IRFM/D0FUS"
Repository = "https://github.com/IRFM/D0FUS"
Documentation = "https://d0fus.readthedocs.io"
"Bug Tracker" = "https://github.com/IRFM/D0FUS/issues"

[project.scripts]
d0fus = "D0FUS:main"

[tool.setuptools]
include-package-data = true
py-modules = ["D0FUS"]

[tool.setuptools.packages.find]
where = ["."]
include = ["D0FUS_BIB*", "D0FUS_EXE*"]

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
